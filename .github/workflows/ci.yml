name: CI & VirusTotal Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application & Package Extension
        run: npm run build

      - name: Verify VirusTotal Security Scan
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: node scripts/check-virustotal.js

      - name: Commit & Push Updated VirusTotal Report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/virustotal-widget.json README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(ci): auto-update VirusTotal report link and hash [skip ci]"
            git push
          else
            echo "No changes in VirusTotal report to commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nimtube-bridge-extension
          path: public/nimtube-bridge.zip
          retention-days: 30
