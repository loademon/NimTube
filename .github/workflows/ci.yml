name: CI & VirusTotal Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application & Package Extension
        run: npm run build

      - name: Verify VirusTotal Security Scan
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: node scripts/check-virustotal.js

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nimtube-bridge-extension
          path: public/nimtube-bridge.zip
          retention-days: 30
