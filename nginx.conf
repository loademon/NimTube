server {
    listen 80;
    server_name nimtube.2615.us localhost _;
    root /usr/share/nginx/html;
    index index.html;

    # Include default MIME types (html, js, css, etc.)
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Ensure WebAssembly MIME type is recognized
    types {
        application/wasm wasm;
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json application/wasm;

    # Cross-Origin Isolation for WebAssembly (SharedArrayBuffer)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Static SEO and Agent crawler files (robots.txt, llms.txt, sitemap.xml)
    location ~* ^/(robots\.txt|llms\.txt|sitemap\.xml)$ {
        allow all;
        log_not_found off;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Single Page Application (SPA) routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|wasm|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Ensure extension zip download works cleanly without caching
    location = /nimtube-bridge.zip {
        add_header Content-Disposition 'attachment; filename="nimtube-bridge.zip"';
        add_header Content-Type application/zip;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }
}
